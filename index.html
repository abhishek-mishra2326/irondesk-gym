<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B3B3F">
<script src="firebase-config.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>IronDesk Gym</title>
<style>
:root{--ink:#0B3B3F;--ink2:#072A2D;--teal:#16595E;--pearl:#F3F0E8;--lime:#B6FF1A;--lime2:#97DB00}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;color:var(--ink);min-height:100vh;padding-bottom:110px;-webkit-font-smoothing:antialiased;background:radial-gradient(900px 420px at 110% -5%,rgba(182,255,26,.16),transparent 60%),radial-gradient(700px 400px at -10% 35%,rgba(22,89,94,.10),transparent 60%),var(--pearl)}
#app{max-width:480px;margin:auto;padding:0 18px 18px}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
h2{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:4px 0 14px}
.s{opacity:.62;font-size:13px;line-height:1.45}
svg{width:22px;height:22px;display:block}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 -18px 16px;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;background:rgba(243,240,232,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(11,59,63,.08)}
.top h1{font-size:22px}.top p.s{font-size:11px;letter-spacing:.1em;font-weight:700;opacity:.5;margin-top:4px}
.clay{background:linear-gradient(145deg,#f8f5ee,#ece8dc);border-radius:24px;padding:18px;margin-bottom:16px;box-shadow:9px 9px 22px rgba(11,59,63,.13),-7px -7px 18px #fff,inset 1px 1px 2px #fff}
.dark{background:linear-gradient(145deg,#18646a,#0B3B3F 60%,#082e31);color:var(--pearl);box-shadow:0 16px 30px rgba(7,42,45,.32),inset 0 1px 0 rgba(255,255,255,.14)}
.dark .s{opacity:.75}.dark .row{border-color:rgba(255,255,255,.14)}
.btn{display:inline-block;text-align:center;text-decoration:none;position:relative;overflow:hidden;border:0;cursor:pointer;font:700 15px inherit;font-family:inherit;padding:14px 20px;border-radius:18px;width:100%;color:var(--ink);background:linear-gradient(180deg,#caff55,var(--lime));box-shadow:0 8px 18px rgba(151,219,0,.38),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.12);transition:transform .2s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.04);transform:translateY(-2px)}
.btn:active{transform:scale(.96);box-shadow:0 3px 8px rgba(151,219,0,.35),inset 0 2px 5px rgba(0,0,0,.15)}
.btn.sm{width:auto;padding:8px 14px;font-size:13px;border-radius:13px}
.btn.t{color:var(--lime);background:linear-gradient(180deg,#186269,#0B3B3F);box-shadow:0 8px 18px rgba(7,42,45,.3),inset 0 1px 0 rgba(255,255,255,.14)}
.btn+.btn{margin-top:10px}
input,select{width:100%;padding:14px 16px;border:0;border-radius:16px;background:#ebe7db;color:var(--ink);font:500 15px inherit;font-family:inherit;margin-bottom:12px;outline:0;box-shadow:inset 3px 3px 8px rgba(11,59,63,.12),inset -3px -3px 8px #fff;transition:box-shadow .25s}
input::placeholder{color:rgba(11,59,63,.45)}
input:focus,select:focus{box-shadow:inset 3px 3px 8px rgba(11,59,63,.12),inset -3px -3px 8px #fff,0 0 0 3px rgba(182,255,26,.7)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid .clay{margin:0}
.hero{position:relative;overflow:hidden;margin:calc(18px + env(safe-area-inset-top)) 0 22px;padding:26px 22px;border-radius:28px;color:var(--pearl);background:linear-gradient(145deg,#1a6166,#0B3B3F 55%,#072A2D);box-shadow:0 18px 36px rgba(7,42,45,.35),inset 0 1px 0 rgba(255,255,255,.14)}
.hero:before{content:"";position:absolute;right:-60px;top:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(182,255,26,.85),rgba(182,255,26,0) 70%);animation:float 7s ease-in-out infinite}
.hero .logo{width:50px;height:50px;border-radius:16px;background:var(--lime);color:var(--ink);display:grid;place-items:center;margin-bottom:18px;box-shadow:0 8px 18px rgba(0,0,0,.25),inset 0 -3px 0 rgba(0,0,0,.12)}
.hero h1{font-size:32px;position:relative}.hero p{opacity:.78;font-size:14px;margin-top:6px;max-width:250px;line-height:1.45;position:relative}
.role{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 10px;cursor:pointer;font-weight:700;transition:transform .25s}
.ico{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--ink);color:var(--lime);transition:background .3s,color .3s,transform .3s}
@media(hover:hover){.role:hover{transform:translateY(-4px)}.role:hover .ico{background:var(--lime);color:var(--ink);transform:rotate(-6deg)}}
.role:active{transform:scale(.96)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid rgba(11,59,63,.09)}.row:last-child{border:0}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(182,255,26,.6);color:var(--ink)}
.tag.r{background:var(--ink);color:var(--lime)}
.big{font-size:32px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.cal{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:8px}.cal i{aspect-ratio:1;border-radius:6px;background:rgba(11,59,63,.1)}.cal i.p{background:var(--lime)}
.bar{height:8px;border-radius:9px;background:rgba(11,59,63,.12);overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--teal),var(--lime));transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
.qbox{background:#fff;border-radius:20px;padding:14px;display:flex;justify-content:center;min-height:200px;box-shadow:0 0 0 3px var(--lime),0 14px 30px rgba(11,59,63,.15)}
nav{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(440px,calc(100% - 24px));display:flex;gap:4px;padding:6px;border-radius:26px;background:linear-gradient(145deg,#17606a,#0B3B3F);box-shadow:0 16px 34px rgba(7,42,45,.4),inset 0 1px 0 rgba(255,255,255,.14);z-index:30}
nav:empty{display:none}
nav button{position:relative;overflow:hidden;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;color:rgba(243,240,232,.72);padding:9px 2px 8px;border-radius:20px;font-family:inherit;font-weight:600;font-size:10.5px;cursor:pointer;transition:background .3s,color .3s,transform .2s}
nav button svg{width:20px;height:20px;transition:transform .3s}
nav button.on{background:var(--lime);color:var(--ink);box-shadow:0 4px 12px rgba(182,255,26,.35)}
nav button.on svg{transform:translateY(-1px) scale(1.12)}
nav button:active{transform:scale(.94)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rp .65s ease-out;pointer-events:none}.t .rip,nav .rip{background:rgba(182,255,26,.35)}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--pearl);border-left:4px solid var(--lime);padding:13px 20px;border-radius:16px;font-weight:600;font-size:14px;z-index:99;max-width:92%;box-shadow:0 14px 30px rgba(7,42,45,.35);animation:tin .35s cubic-bezier(.2,.8,.2,1)}
.ov{position:fixed;inset:0;background:rgba(7,42,45,.78);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;animation:fade .3s}
#mode{position:fixed;top:6px;right:10px;font-size:10px;font-weight:600;opacity:.55;z-index:40;pointer-events:none}
.enter>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
.enter .cal i.p{animation:pop .45s both}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}}
@keyframes pop{from{transform:scale(0)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes rp{to{transform:scale(4);opacity:0}}
@keyframes tin{from{opacity:0;transform:translate(-50%,-18px)}}
@keyframes fade{from{opacity:0}}
@keyframes float{50%{transform:translate(-12px,14px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="mode"></div><div id="app"></div><nav id="nav"></nav>
<script>
const ICONS={logo:'<path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/>',trainer:'<path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/>',plan:'<path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/>',
member:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',join:'<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/>',
mine:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
gone:'<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M18 8l5 5M23 8l-5 5"/>',
qr:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v7M14 20h3"/>',
att:'<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14l-3-3"/>',fees:'<path d="M6 4h12M6 9h12M6 4c7 0 7 10 0 10l8 6"/>',
ren:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/>',
diet:'<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10zM2 21c0-3 1.9-5.4 5.1-6"/>',
rep:'<path d="M18 20V10M12 20V4M6 20v-6"/>',owner:'<path d="M2 18l2-11 5 5 3-8 3 8 5-5 2 11zM3 21h18"/>',reception:'<path d="M4 18h16M5 18a7 7 0 0 1 14 0M12 5v3M10 5h4"/>'};
const ic=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]||''}</svg>`;
const $=s=>document.querySelector(s),TODAY=new Date().toISOString().slice(0,10),PRICE=500;
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const dl=d=>Math.ceil((new Date(d)-new Date(TODAY))/864e5),inr=n=>'₹'+n.toLocaleString('en-IN');
const loadJS=u=>new Promise((r,j)=>{const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=j;document.head.appendChild(s)});
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
let DB={m:[],pay:[],req:[],staff:[],set:{trainers:[]}},fdb,auth,a2,usr=null,unsubs=[],pick_=null,role=null,scr=null,meId=null,tName=null,q='';
const putM=m=>fdb.collection('members').doc(''+m.id).set(m);
async function delM(id){const m=DB.m.find(x=>x.id==id);await fdb.collection('members').doc(''+id).delete();if(m&&m.uid)fdb.doc('users/'+m.uid).delete().catch(()=>{})}
const addPay=p=>{p.t=Date.now();fdb.collection('pays').add(p)};
async function mkUser(e,p){if(!a2)a2=firebase.initializeApp(FIREBASE_CONFIG,'sec').auth();const c=await a2.createUserWithEmailAndPassword(e,p);await a2.signOut();return c.user.uid}
const nextId=()=>fdb.runTransaction(async t=>{const r=fdb.doc('counter/m'),s=await t.get(r),n=(s.exists?s.data().n:100)+1;t.set(r,{n});return n});
async function init(){
 try{const b='https://www.gstatic.com/firebasejs/10.12.2/firebase-';for(const x of['app','auth','firestore'])await loadJS(b+x+'-compat.js');
 firebase.initializeApp(FIREBASE_CONFIG);fdb=firebase.firestore();auth=firebase.auth();auth.onAuthStateChanged(onUser);$('#mode').textContent='Secure live sync'}
 catch(e){$('#mode').textContent='Internet/Firebase load nahi hua';login()}}
async function onUser(u){unsubs.forEach(f=>f());unsubs=[];if(!u){role=null;usr=null;return login()}
 try{const s=await fdb.doc('users/'+u.uid).get();if(!s.exists){toast('Is account ka role set nahi hai');return auth.signOut()}
 usr=s.data();role=usr.role;if(pick_&&pick_!=role){toast('Ye account '+role+' ka hai');pick_=null;return auth.signOut()}pick_=null;tName=usr.name;meId=usr.memberId;
 const er=e=>toast('Error: '+e.code),on=(r,f)=>unsubs.push(r.onSnapshot(f,er)),L=s=>s.docs.map(d=>({...d.data(),_id:d.id}));
 if(role=='member'){const d=await fdb.doc('members/'+meId).get();DB.m=d.exists?[d.data()]:[];on(fdb.doc('members/'+meId),d=>{DB.m=d.exists?[d.data()]:[];refresh()})}
 else{let mq=fdb.collection('members');if(role=='trainer')mq=mq.where('trainer','==',tName);on(mq,s=>{DB.m=s.docs.map(d=>d.data());refresh()});
  on(fdb.doc('cfg/main'),s=>{if(s.exists)DB.set=s.data();else if(role=='owner')fdb.doc('cfg/main').set({trainers:[]});refresh()});
  if(role!='trainer'){on(fdb.collection('pays'),s=>{DB.pay=s.docs.map(d=>d.data()).sort((a,b)=>a.t-b.t);refresh()});on(fdb.collection('requests'),s=>{DB.req=L(s);refresh()})}
  if(role=='owner')on(fdb.collection('users').where('role','in',['owner','reception','trainer']),s=>{DB.staff=s.docs.map(d=>({...d.data(),uid:d.id}));refresh()})}
 go(NAV[role][0][0])}catch(e){toast('Error: '+(e.code||e.message));auth.signOut()}}
function refresh(){if(role&&!document.activeElement.matches('input,select'))render()}
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)};
const M=()=>DB.m.find(m=>m.id==meId),due=m=>m.fee-m.paid,gone=m=>-dl(m.last),gayab=()=>DB.m.filter(m=>gone(m)>=7);
const mine=()=>DB.m.filter(m=>m.trainer==tName);
const wa=(m,t)=>`https://wa.me/91${m.phone.replace(/\D/g,'').slice(-10)}?text=${encodeURIComponent(t)}`;
const status=m=>{const d=dl(m.end);return d<0?'<span class="tag r">KHATAM</span>':d<=7?`<span class="tag r">${d}d left</span>`:'<span class="tag">Active</span>'};
const NAV={guest:[['join','Join']],member:[['join','Join'],['qr','QR'],['plan','Plans']],reception:[['att','Attendance'],['fees','Fees'],['ren','Renewals']],trainer:[['mine','My Members'],['diet','Diet']],owner:[['rep','Report'],['gone','Members']]};
NAV.member=NAV.member.filter(n=>n[0]!='join');
const go=s=>{scr=s;render()};
function login(){role=null;meId=null;$('#nav').innerHTML='';$('#app').innerHTML=`<div class="hero"><div class="logo">${ic('logo')}</div><h1>IronDesk</h1><p>Fees, renewals aur attendance — sab ek jagah.</p></div><h2>Login as</h2><div class="grid">
${[['member','','Member'],['reception','','Reception'],['trainer','','Trainer'],['owner','','Owner']].map(r=>`<div class="clay role" onclick="pick('${r[0]}')"><i class="ico">${ic(r[0])}</i>${r[2]}</div>`).join('')}</div><div id="lf"></div><button class="btn t" onclick="role='guest';go('join')">Naye ho? Online Join request bhejein</button>`}
function pick(r){$('#lf').innerHTML=`<div class="clay"><h2>${r.toUpperCase()} login</h2>${r=='member'?'<input id="u" placeholder="Member ID" inputmode="numeric"><input id="p" type="password" placeholder="Password (aapka 10-digit phone number)" inputmode="numeric">':'<input id="u" type="email" placeholder="Email"><input id="p" type="password" placeholder="Password">'}<button class="btn" onclick="doLogin('${r}')">Login</button></div>`;$('#lf').scrollIntoView({behavior:'smooth'})}
async function doLogin(r){const u=$('#u').value.trim(),p=$('#p').value.trim();if(!u||!p)return toast('Sab fields bharein');pick_=r;try{await auth.signInWithEmailAndPassword(r=='member'?`m${u}@irondesk.app`:u,p)}catch(e){pick_=null;toast('Login fail: ID/email ya password galat')}}
function render(){if(!role)return;if(role=='member'&&!M())return auth.signOut();const nv=NAV[role];$('#nav').innerHTML=nv.length>1?nv.map(n=>`<button class="${n[0]==scr?'on':''}" onclick="go('${n[0]}')">${ic(n[0])}<span>${n[1]}</span></button>`).join(''):'';
$('#app').innerHTML=`<div class="top"><div><h1>${nv.find(n=>n[0]==scr)[1]}</h1><p class="s">${role.toUpperCase()}${role=='member'?' • '+M().name:role=='trainer'?' • '+tName:''}</p></div><button class="btn t sm" onclick="${role=='guest'?'login()':'auth.signOut()'}">${role=='guest'?'Back':'Logout'}</button></div>`+V[scr]();if(scr=='att')render2()}
const mrow=(m,btn)=>`<div class="row"><div><b>${m.name}</b> <span class="s">#${m.id}</span><br><span class="s">${m.phone} • ${m.trainer}</span></div>${btn}</div>`;
const plansOpt=`${[1,3,6,12].map(n=>`<option value="${n}">${n} Month${n>1?'s':''} – ${inr(PRICE*n)}</option>`).join('')}`;
const addForm=()=>`<div class="clay"><h2>Naya Member Add</h2><input id="jn" placeholder="Full name"><input id="jp" placeholder="10-digit phone (last 4 digit = member PIN)" inputmode="tel" maxlength="10"><select id="jl">${plansOpt}</select><select id="jt">${(DB.set.trainers||[]).map(t=>`<option>${t}</option>`).join('')}</select><button class="btn" onclick="joinNow()">Add Member</button></div>`;
const V={
join:()=>`<div class="clay"><h2>Online Joining</h2><p class="s" style="margin-bottom:10px">Fees: ${inr(PRICE)} per month</p><input id="jn" placeholder="Full name"><input id="jp" placeholder="10-digit phone" inputmode="tel" maxlength="10"><select id="jl">${plansOpt}</select><button class="btn" onclick="joinNow()">Join Now</button></div>`,
qr:()=>{const m=M();setTimeout(async()=>{try{if(!window.qrcode)await loadJS('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js');const c=qrcode(0,'M');c.addData('GYM:'+m.id);c.make();$('#qs').innerHTML=c.createSvgTag(6,0)}catch{$('#qs').innerHTML='<p class="s">Pehli baar internet on karke QR load karein</p>'}},0);
 return`<div class="clay"><div id="qs" class="qbox"></div><p class="s" style="text-align:center;margin-top:10px">Member #${m.id} • Gate par reception ko scan karwayein</p></div><div class="clay"><b>Membership</b> ${status(m)}<div class="bar"><i style="width:${Math.max(4,Math.min(100,dl(m.end)/(m.plan*30)*100))}%"></i></div><p class="s" style="margin:6px 0">Ends ${m.end} • Baaki fees ${inr(due(m))}</p><b>Last 30 din</b><div class="cal">${Array.from({length:30},(_,i)=>`<i class="${m.att.includes(addD(TODAY,i-29))?'p':''}"></i>`).join('')}</div></div>`},
plan:()=>{const m=M(),W=[['Chest + Triceps','Bench 4x10, Incline DB 3x12, Dips 3x12'],['Back + Biceps','Deadlift 4x8, Rows 3x12, Curls 3x12'],['Legs','Squat 4x10, Leg press 3x12, Lunges 3x12'],['Shoulders + Abs','OHP 4x10, Lateral raise 3x15, Plank 3x60s'],['Cardio + Core','Treadmill 25 min, Cycling 15 min, Crunches']];
 return`<div class="clay dark"><b>Aapka diet plan</b><p style="margin-top:6px">${m.diet||'Trainer ne abhi assign nahi kiya'}</p></div>`+W.map((w,i)=>`<div class="clay"><b>Day ${i+1}: ${w[0]}</b><p class="s" style="margin-top:6px">${w[1]}</p></div>`).join('')},
att:()=>reqCard()+addForm()+`<button class="btn" onclick="scanQR()" style="margin-bottom:14px">Scan Member QR</button><input placeholder="Search name / ID" oninput="q=this.value;render2()" id="sq"><div class="clay" id="al"></div>`,
fees:()=>`<div class="clay"><h2>Fees Entry</h2><select id="fm">${DB.m.map(m=>`<option value="${m.id}">${m.name} (#${m.id}) – baaki ${inr(due(m))}</option>`).join('')}</select><input id="fa" type="number" placeholder="Amount ₹" inputmode="numeric"><select id="fmo"><option>Cash</option><option>UPI</option><option>Card</option></select><button class="btn" onclick="payFee()">Save Payment</button></div><div class="clay"><b>Recent payments</b>${DB.pay.slice(-6).reverse().map(p=>`<div class="row"><span>${p.n}</span><span class="tag">${inr(p.a)} ${p.mo}</span></div>`).join('')||'<p class="s">Abhi koi entry nahi</p>'}</div>`,
ren:()=>{const l=DB.m.filter(m=>dl(m.end)<=7).sort((a,b)=>dl(a.end)-dl(b.end));return remCard()+`<p class="s" style="margin-bottom:12px">Khatam ya 7 din me khatam hone wale members</p><div class="clay">${l.map(m=>mrow(m,`<div style="text-align:right">${status(m)}<br><button class="btn sm" style="margin:6px 4px 0 0" onclick="renew(${m.id})">Renew</button><a class="btn sm t" style="text-decoration:none" href="${wa(m,`Hi ${m.name}, aapki gym membership ${m.end} ko khatam ho rahi hai. Renew karwa lein `)}">WA</a></div>`)).join('')||'Sab active '}</div>`},
mine:()=>`<div class="clay"><h2>Naya Member Add</h2><input id="jn" placeholder="Full name"><input id="jp" placeholder="10-digit phone" inputmode="tel" maxlength="10"><select id="jl">${plansOpt}</select><button class="btn" onclick="joinNow(tName)">Add Member</button></div><div class="clay"><b>Mere members (${mine().length})</b>${mine().map(m=>mrow(m,`<div style="text-align:right">${status(m)}<br><button class="btn sm t" style="margin-top:6px" onclick="rm(${m.id})">Remove</button></div>`)).join('')||'<p class="s">Koi member nahi</p>'}</div>`,
diet:()=>{const D=[['Weight Loss','Oats+egg whites | Dal+roti+salad | Paneer+veg | Fruits, 3L water'],['Muscle Gain','Paneer paratha+milk | Rice+chicken+dal | Eggs+banana shake | Roti+soya'],['Maintenance','Poha | Roti+sabzi+curd | Sprouts | Dal-chawal+salad']];
 return`<div class="clay"><h2>Diet Assign</h2><select id="dm">${mine().map(m=>`<option value="${m.id}">${m.name}${m.diet?' ('+m.diet+')':''}</option>`).join('')}</select><select id="dt">${D.map(d=>`<option>${d[0]}</option>`).join('')}</select><button class="btn" onclick="assignDiet()">Assign Diet</button></div>`+D.map(d=>`<div class="clay"><b>${d[0]}</b><p class="s" style="margin-top:6px">${d[1]}</p></div>`).join('')},
rep:()=>{const t=DB.m.filter(m=>m.att.includes(TODAY)).length,pt=DB.pay.filter(p=>p.d==TODAY).reduce((a,p)=>a+p.a,0),pm=DB.pay.filter(p=>p.d.slice(0,7)==TODAY.slice(0,7)).reduce((a,p)=>a+p.a,0),dm=DB.m.filter(m=>due(m)>0),dt=dm.reduce((a,m)=>a+due(m),0);
 return`<div class="grid"><div class="clay dark"><p class="s" style="color:#fff">Aaj aaye</p><div class="big" style="color:var(--lime)">${t}</div></div><div class="clay dark"><p class="s" style="color:#fff">Aaj collection</p><div class="big" style="color:var(--lime)">${inr(pt)}</div></div><div class="clay"><p class="s">Is mahine collection</p><div class="big">${inr(pm)}</div></div><div class="clay"><p class="s">Total baaki</p><div class="big">${inr(dt)}</div></div></div>
<div class="clay"><b>Baaki fees wale (${dm.length}) — fees jama wale yahan nahi</b>${dm.map(m=>`<div class="row"><div><b>${m.name}</b><br><span class="s">${m.phone}</span></div><div style="text-align:right"><span class="tag r">${inr(due(m))}</span><br><a class="btn sm" style="text-decoration:none;margin-top:6px" href="${wa(m,`Hi ${m.name}, ${inr(due(m))} fees baaki hai. Please jama kar dein `)}">Remind</a></div></div>`).join('')||'Sabki fees jama '}</div>
<div class="clay"><b>Members: ${DB.m.length} • Gayab: ${gayab().length}</b></div>${staffCard()}`},
gone:()=>reqCard()+addForm()+`<div class="clay"><b>Gayab (7+ din) — ${gayab().length}</b>${gayab().map(m=>mrow(m,`<div style="text-align:right"><span class="s">${gone(m)} din</span><br><a class="btn sm" style="text-decoration:none;margin:6px 4px 0 0" href="${wa(m,`Hi ${m.name}, aapko gym me miss kar rahe hain! Wapas aaiye `)}">WA</a><button class="btn sm t" onclick="rm(${m.id})">Remove</button></div>`)).join('')||'Koi gayab nahi '}</div><div class="clay"><b>Saare members (${DB.m.length})</b>${DB.m.map(m=>mrow(m,`<div style="text-align:right">${status(m)}<br><button class="btn sm t" style="margin-top:6px" onclick="rm(${m.id})">Remove</button></div>`)).join('')}</div>`};
function render2(){const e=$('#al');if(!e)return;e.innerHTML=DB.m.filter(m=>(m.name+m.id).toLowerCase().includes(q.toLowerCase())).map(m=>mrow(m,`<div style="text-align:right">${status(m)}<br><button class="btn sm ${m.att.includes(TODAY)?'t':''}" style="margin-top:6px" onclick="mark(${m.id})">${m.att.includes(TODAY)?'Present ✓':'Mark'}</button></div>`)).join('')}
function checkin(m,force){if(dl(m.end)<0&&!force)return false;if(!m.att.includes(TODAY))m.att.push(TODAY);m.last=TODAY;putM(m);return true}
function mark(id){const m=DB.m.find(x=>x.id==id);if(dl(m.end)<0&&!confirm('Membership KHATAM hai. Phir bhi mark karein?'))return;checkin(m,1);render2()}
async function scanQR(){const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="clay" style="width:92%;max-width:420px"><div id="rd"></div><button class="btn t" style="margin-top:12px" id="rx">Close</button></div>';document.body.appendChild(o);let sc,last=0;
 $('#rx').onclick=async()=>{try{await sc.stop()}catch{}o.remove()};
 try{if(!window.Html5Qrcode)await loadJS('https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js');sc=new Html5Qrcode('rd');
 await sc.start({facingMode:'environment'},{fps:10,qrbox:220},t=>{if(Date.now()-last<2500)return;last=Date.now();const m=DB.m.find(x=>'GYM:'+x.id==t);if(!m)return toast('Unknown QR');toast(checkin(m)?`${m.name} present`:`${m.name}: membership KHATAM`);render2()})}catch{toast('Camera ya internet available nahi');o.remove()}}
async function createMember(n,p,pl,tr){for(let i=0;i<6;i++){const id=await nextId();try{const uid=await mkUser(`m${id}@irondesk.app`,p);await fdb.collection('members').doc(''+id).set({id,uid,name:n,phone:p,plan:pl,fee:PRICE*pl,paid:0,end:addD(TODAY,pl*30),trainer:tr,last:TODAY,att:[],diet:''});await fdb.doc('users/'+uid).set({role:'member',memberId:id,name:n});return id}catch(e){if(e.code!='auth/email-already-in-use'){toast('Error: '+(e.code||e.message));return 0}}}return 0}
async function joinNow(tr){const n=$('#jn').value.trim(),p=$('#jp').value.trim();if(!n||!/^\d{10}$/.test(p))return toast('Naam aur 10-digit phone bharo');const pl=+$('#jl').value;
 if(role=='guest'){try{await fdb.collection('requests').add({name:n,phone:p,plan:pl,t:Date.now()});alert('Request bhej di gayi \nReception fees lekar aapka Member ID dega.\nLogin password: aapka phone number.');login()}catch(e){toast('Error: '+(e.code||e.message))}return}
 const id=await createMember(n,p,pl,typeof tr=='string'?tr:$('#jt')?$('#jt').value:'');if(id){alert(`Member add ho gaya!\nID: ${id}\nLogin password: phone number (${p})`);render()}}
async function approveReq(i){const r=DB.req.find(x=>x._id==i);const id=await createMember(r.name,r.phone,r.plan,(DB.set.trainers||[])[0]||'');if(id){await fdb.collection('requests').doc(i).delete();alert(`Approved!\nID: ${id}\nPassword: ${r.phone}`)}}
const delReq=i=>confirm('Request hatayein?')&&fdb.collection('requests').doc(i).delete();
function rm(id){const m=DB.m.find(x=>x.id==id);if(confirm(`${m.name} (#${id}) ko remove karein? Ye undo nahi hoga.`)){delM(id);render()}}
function payFee(){const m=DB.m.find(x=>x.id==$('#fm').value),a=+$('#fa').value;if(!a||a<=0)return toast('Amount daalo');if(a>due(m))return toast('Baaki sirf '+inr(due(m))+' hai');m.paid+=a;putM(m);addPay({n:m.name,a,mo:$('#fmo').value,d:TODAY});toast('Payment saved ');render()}
function renew(id){const m=DB.m.find(x=>x.id==id),n=+prompt('Kitne mahine? (1 / 3 / 6 / 12)','1');if(![1,3,6,12].includes(n))return;m.plan=n;m.end=addD(dl(m.end)>0?m.end:TODAY,n*30);m.fee+=PRICE*n;putM(m);render()}
function assignDiet(){const m=DB.m.find(x=>x.id==$('#dm').value);if(!m)return;m.diet=$('#dt').value;putM(m);toast('Diet assigned ');render()}
const planName=n=>n+' mahine';
const reqCard=()=>`<div class="clay"><b>Join requests (${DB.req.length})</b>${DB.req.map(r=>`<div class="row"><div><b>${r.name}</b><br><span class="s">${r.phone} • ${planName(r.plan)} • ${inr(PRICE*r.plan)}</span></div><div><button class="btn sm" onclick="approveReq('${r._id}')">Approve</button> <button class="btn sm t" onclick="delReq('${r._id}')">✕</button></div></div>`).join('')||'<p class="s">Koi nayi request nahi</p>'}</div>`;
const remList=()=>DB.m.filter(m=>m.rem!=TODAY&&(due(m)>0||(dl(m.end)<=3&&dl(m.end)>=-30)));
const remMsg=m=>{let t=`Hi ${m.name}, IronDesk Gym se: `;if(dl(m.end)<=3)t+=dl(m.end)<0?'aapki membership khatam ho chuki hai. ':`aapki membership ${m.end} ko khatam ho rahi hai. `;if(due(m)>0)t+=`${inr(due(m))} fees baaki hai. `;return t+'Reception par aakar renew/jama karwa lein '};
const remCard=()=>`<div class="clay dark"><b>Aaj ke reminders (${remList().length})</b><p class="s" style="color:#F3F0E8">Send dabao → WhatsApp khulega → Send. Bhejne ke baad list se hat jaata hai.</p>${remList().map(m=>`<div class="row"><span>${m.name}</span><a class="btn sm" style="text-decoration:none" target="_blank" href="${wa(m,remMsg(m))}" onclick="remDone(${m.id})">Send</a></div>`).join('')||'<p class="s">Aaj koi reminder nahi </p>'}</div>`;
function remDone(id){const m=DB.m.find(x=>x.id==id);m.rem=TODAY;putM(m)}
const staffCard=()=>`<div class="clay"><b>Staff accounts</b>${DB.staff.map(s=>`<div class="row"><div><b>${s.name}</b><br><span class="s">${s.role} • ${s.email||''}</span></div>${s.role=='owner'?'':`<button class="btn sm t" onclick="rmStaff('${s.uid}')">Remove</button>`}</div>`).join('')}<input id="sn" placeholder="Naam"><input id="se" type="email" placeholder="Email"><input id="sp" type="password" placeholder="Password (6+ character)"><select id="sr"><option>reception</option><option>trainer</option></select><button class="btn" onclick="addStaff()">Staff Add</button></div>`;
async function addStaff(){const n=$('#sn').value.trim(),e=$('#se').value.trim(),p=$('#sp').value,r=$('#sr').value;if(!n||!e||p.length<6)return toast('Naam, email, 6+ char password bharein');try{const uid=await mkUser(e,p);await fdb.doc('users/'+uid).set({role:r,name:n,email:e});if(r=='trainer')await fdb.doc('cfg/main').update({trainers:firebase.firestore.FieldValue.arrayUnion(n)});toast('Staff add ');['sn','se','sp'].forEach(i=>$('#'+i).value='')}catch(x){toast('Error: '+(x.code||x.message))}}
async function rmStaff(uid){const s=DB.staff.find(x=>x.uid==uid);if(!confirm(s.name+' ko remove karein?'))return;await fdb.doc('users/'+uid).delete();if(s.role=='trainer')await fdb.doc('cfg/main').update({trainers:firebase.firestore.FieldValue.arrayRemove(s.name)})}
let _ls=null;
function anim(){try{const a=$('#app');a.classList.remove('enter');[...a.children].forEach((e,i)=>e.style.setProperty('--i',Math.min(i,8)));void a.offsetWidth;a.classList.add('enter');
 a.querySelectorAll('.big').forEach(e=>{const t=e.textContent,n=+t.replace(/[^\d]/g,'');if(!n)return;const p=t.startsWith('₹')?'₹':'',s=performance.now();(function f(now){const k=Math.min(1,(now-s)/800);e.textContent=p+Math.round(n*(1-Math.pow(1-k,3))).toLocaleString('en-IN');if(k<1)requestAnimationFrame(f)})(s)})}catch(e){}}
const _render=render;render=function(){_render();const k=role+'|'+scr;if(k!==_ls){_ls=k;anim()}};
const _login=login;login=function(){_login();_ls=null;anim()};
document.addEventListener('click',e=>{try{const b=e.target.closest('.btn,.role,nav button');if(!b)return;navigator.vibrate&&navigator.vibrate(8);const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement('span');s.className='rip';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),700)}catch(x){}});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
$('#app').innerHTML='<p class="s">Loading…</p>';init();
</script></body></html>
